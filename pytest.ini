[pytest]
testpaths =
    packages/kaori-truth
    packages/kaori-flow
    packages/kaori-db
    packages/kaori-api
    tests
pythonpath =
    packages/kaori-truth/src
    packages/kaori-flow/src
    packages/kaori-db/src
    packages/kaori-api/src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --tb=short
